{% extends "base.html" %}

{% block title %}上架新商品{% endblock %}

{% block content %}
<div class="page-head">
    <p class="page-kicker">New Product</p>
    <h1 class="page-title">上架新商品</h1>
</div>

<div class="panel form-wide">
    {% if err %}<p class="text-danger">{{ err }}</p>{% endif %}
    <form action="{% url 'seller_add_goods' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="grid grid-2">
            <div class="field">
                <label>商品名称</label>
                <input class="input" type="text" name="name" required>
            </div>
            <div class="field">
                <label>商品分类</label>
                <select class="select" name="category">
                    {% for value, label in category_list %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label>售价（元）</label>
                <input class="input" type="number" step="0.01" min="0.01" name="price" required>
            </div>
            <div class="field">
                <label>规格/重量</label>
                <input class="input" type="text" name="weight" placeholder="例如：500g/1份/2瓶装" required>
            </div>
            <div class="field">
                <label>库存数量</label>
                <input class="input" type="number" min="0" name="stock" required>
            </div>
            <div class="field">
                <label>商品主图（不超过 5MB）</label>
                <input class="input" type="file" accept="image/png,image/jpg,image/jpeg" name="imgurl" required>
            </div>
        </div>
        <div class="field">
            <label>商品简介</label>
            <textarea class="textarea" name="goodsdesc" rows="4"></textarea>
        </div>
        <div class="flex">
            <button class="btn btn-primary" type="submit">提交上架</button>
            <a class="btn btn-ghost" href="{% url 'seller_goods_list' %}">返回商品列表</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .form-wide { max-width: 860px; margin: 0 auto; }
</style>
{% endblock %}
