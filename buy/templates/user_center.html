{% extends "base.html" %}

{% block title %}个人中心{% endblock %}

{% block content %}
<div class="page-head">
    <p class="page-kicker">My Account</p>
    <h1 class="page-title">个人中心</h1>
    <p class="page-sub">管理你的资料、密码和常用入口。</p>
</div>

<div class="grid grid-2">
    <div class="panel">
        <h2 class="panel-title">基本资料</h2>
        <form action="{% url 'edit_user_info' %}" method="post">
            {% csrf_token %}
            <div class="field">
                <label>用户名</label>
                <input class="input" type="text" value="{{ user.username }}" disabled>
            </div>
            <div class="field">
                <label>手机号</label>
                <input class="input" type="text" name="phone" value="{{ user.phone }}">
            </div>
            <div class="field">
                <label>邮箱</label>
                <input class="input" type="email" name="email" value="{{ user.email }}">
            </div>
            <button class="btn btn-primary" type="submit">保存修改</button>
        </form>
    </div>

    <div class="panel">
        <h2 class="panel-title">修改密码</h2>
        <form action="{% url 'modify_pwd' %}" method="post">
            {% csrf_token %}
            <div class="field">
                <label>原密码</label>
                <input class="input" type="password" name="old_pwd" required>
            </div>
            <div class="field">
                <label>新密码（至少 8 位）</label>
                <input class="input" type="password" name="new_pwd" required>
            </div>
            <div class="field">
                <label>确认新密码</label>
                <input class="input" type="password" name="new_pwd2" required>
            </div>
            <button class="btn btn-accent" type="submit">确认修改</button>
        </form>
    </div>
</div>

<div class="panel">
    <h2 class="panel-title">常用入口</h2>
    <div class="flex">
        <a class="btn btn-ghost" href="{% url 'address_list' %}">收货地址管理</a>
        <a class="btn btn-ghost" href="{% url 'orderlist' %}">我的全部订单</a>
        <a class="btn btn-ghost" href="{% url 'my_collect' %}">我的收藏</a>
        <a class="btn btn-ghost" href="{% url 'carlist' %}">我的购物车</a>
    </div>
</div>
{% endblock %}
